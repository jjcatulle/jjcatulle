<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-label="About JC: Software Engineer building web and mobile apps, API integrations and ML models in Python, JavaScript and Java. Engineering background. Open to Software Engineer roles.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a1f"/><stop offset="1" stop-color="#1a0b33"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .scan{animation:scan 4s linear infinite}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
</style>
<rect x="1" y="1" width="1198" height="370" rx="16" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="370" rx="16" fill="url(#grid)"/><rect x="1.5" y="1.5" width="1197" height="369" rx="16" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
