<g class="scan"><rect x="0" y="41" width="160" height="2" fill="url(#neon)" opacity="0.8"/></g>
<text x="34" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17"><tspan fill="#f472b6">jc@neon-desk</tspan><tspan fill="#64748b">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">whoami</tspan></text>
<text x="34" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#f8fafc">JC</tspan><tspan fill="#cbd5e1">  ·  Software Engineer  ·  full-stack, mobile &amp; ML</tspan></text>
<text x="34" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17"><tspan fill="#f472b6">jc@neon-desk</tspan><tspan fill="#64748b">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">cat about.txt</tspan></text>
<text x="34" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#cbd5e1">I build web and mobile apps, API integrations and machine learning</tspan></text>
<text x="34" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#cbd5e1">models, mostly in </tspan><tspan fill="#22d3ee">Python</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#facc15">JavaScript</tspan><tspan fill="#cbd5e1"> and </tspan><tspan fill="#f472b6">Java</tspan><tspan fill="#cbd5e1">.</tspan></text>
<text x="34" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#cbd5e1">Engineering background: robotics, circuit design tools and</tspan></text>
<text x="34" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#cbd5e1">scripting against serial devices. Writing code since 2018.</tspan></text>
<text x="34" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17"><tspan fill="#f472b6">jc@neon-desk</tspan><tspan fill="#64748b">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">status --open-to-work</tspan></text>
<text x="34" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve"><tspan fill="#4ade80">✔ </tspan><tspan fill="#4ade80">Open to Software Engineer roles  ·  remote / hybrid / on-site</tspan></text>
<text x="34" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17"><tspan fill="#f472b6">jc@neon-desk</tspan><tspan fill="#64748b">:</tspan><tspan fill="#22d3ee">~</tspan><tspan fill="#64748b">$ </tspan></text>
