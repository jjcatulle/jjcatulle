<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Front-End Work: Responsive single-page sites with a component-based UI and client-side routing. Modern CSS layout practice in Sass for my portfolio site. Stack: React, Material UI, React Router, Sass">
<defs>
