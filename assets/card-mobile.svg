<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Social App: Android to Flutter: Native Android app with registration, login, profile setup, posting and drawer navigation. Rebuilt cross-platform in Flutter and deployed to Firebase Hosting. Stack: Java, Android SDK, Flutter, Firebase">
<defs>
