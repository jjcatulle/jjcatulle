<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="API Integrations &amp; Data: Bulk elevation scraper on the Google Maps API, used to model Mt. Everest in 3D for multivariable calculus. Discord-to-Twitter service that auto-posts channel images, deployed on Heroku. Stack: Node.js, Google Maps API, Discord, Twitter">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a1f"/><stop offset="1" stop-color="#1a0b33"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .scan{animation:scan 4s linear infinite}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
</style>
<rect x="1" y="1" width="598" height="328" rx="14" fill="url(#bg)"/><rect x="1" y="1" width="598" height="328" rx="14" fill="url(#grid)"/><rect x="1.5" y="1.5" width="597" height="327" rx="14" fill="none" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/>
<path d="M14 32 V14 H32" fill="none" stroke="#4ade80" stroke-width="2.5" filter="url(#glow)"/>
<path d="M586 32 V14 H568" fill="none" stroke="#4ade80" stroke-width="2.5" filter="url(#glow)"/>
<path d="M14 298 V316 H32" fill="none" stroke="#4ade80" stroke-width="2.5" filter="url(#glow)"/>
<path d="M586 298 V316 H568" fill="none" stroke="#4ade80" stroke-width="2.5" filter="url(#glow)"/>
<text x="566" y="62" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="44" font-weight="800" fill="#4ade80" fill-opacity="0.18">05</text>
<text x="34" y="58" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#f8fafc">API Integrations &amp; Data</text>
<rect x="34" y="70" width="70" height="3" rx="1.5" fill="#4ade80" filter="url(#glow)"/>
<rect x="34" y="88" width="68" height="26" rx="13" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1.4"/><text x="68" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#4ade80">Node.js</text>
<rect x="110" y="88" width="126" height="26" rx="13" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1.4"/><text x="173" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#4ade80">Google Maps API</text>
<rect x="244" y="88" width="68" height="26" rx="13" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1.4"/><text x="279" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#4ade80">Discord</text>
<rect x="321" y="88" width="68" height="26" rx="13" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1.4"/><text x="355" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#4ade80">Twitter</text>
<text x="34" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">Bulk elevation scraper on the Google Maps API,</text>
<text x="34" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">used to model Mt. Everest in 3D for</text>
<text x="34" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">multivariable calculus.</text>
<text x="34" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">Discord-to-Twitter service that auto-posts</text>
<text x="34" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#cbd5e1">channel images, deployed on Heroku.</text>
